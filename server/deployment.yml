apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership
  labels:
    app: dealership
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dealership
  template:
    metadata:
      labels:
        app: dealership
    spec:
      containers:
        - name: dealership
          image: us.icr.io/sn-labs-manthankhand/dealership:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_DEBUG
              value: "0"
            - name: backend_url
              value: "http://dealership-api:3030"
            - name: sentiment_analyzer_url
              value: "http://sentiment:5050"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dealership
spec:
  type: NodePort
  selector:
    app: dealership
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
